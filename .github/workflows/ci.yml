name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # 允许 Actions 页手动触发（验证 secret/凭据等场景）

permissions:
  contents: read

jobs:
  lint-knowledge:
    name: 知识库结构校验（knowledge-lint）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # 子模块 lomehong/dsh-architect 已公开（2026-09-11 主人拍板路线 C，U1 销账）：
          # 默认 github.token 即可拉取；SUBMODULE_TOKEN 回退保留为无害冗余（兼容将来重新私有化）。
          token: ${{ secrets.SUBMODULE_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 构建校验器（architect-core → dsh-architect）
        # 序不可倒：dsh-architect 的 file: 依赖在 npm ci 时会触发 core 的 prepare 构建，
        # 冷环境必须先装好 core 的 devDependencies（2026-09-11 run #53 实证 TS2688）
        run: |
          npm --prefix packages/architect-core ci
          npm --prefix packages/architect-core run build
          npm --prefix dsh-architect ci
          npm --prefix dsh-architect run build
      - name: knowledge-lint（error 阻断——主人 2026-09-10 拍板 Q1）
        run: node dsh-architect/scripts/lint-knowledge.mjs architect-knowledge
      - name: SKILL 三副本一致性校验（G3，权威源 skills/）
        run: node scripts/check-skills-sync.mjs
      - name: 任务台账契约校验（Task Surface：自测红绿 + 结构校验）
        run: |
          node scripts/task-ledger.mjs --selftest
          node scripts/task-ledger.mjs --validate --root .
