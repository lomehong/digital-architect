# =============================================================================
#  oh-my-pi（omp 官方版）— docker-compose.yml
#  官方仓库：https://github.com/can1357/oh-my-pi（omp.sh）
#  Usage:
#    docker compose up -d                          # 常驻（exec 进去跑 omp）
#    docker exec -it oh-my-pi omp                  # 交互 TUI
#    docker compose run --rm omp -p "总结这个项目"   # 一次性任务
# =============================================================================
services:
  omp:
    build:
      context: .
      args:
        # 国内加速默认值在 Dockerfile；如需切官方源或换加速站：
        #   docker compose build --build-arg APT_MIRROR=deb.debian.org --build-arg NPM_REGISTRY=https://registry.npmjs.org
        NODE_IMAGE: ${NODE_IMAGE:-node:24-bookworm-slim}
        APT_MIRROR: ${APT_MIRROR:-mirrors.aliyun.com}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    container_name: oh-my-pi
    environment:
      - TZ=Asia/Shanghai
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - KB_ROOT=/opt/architect/architect-knowledge
      # DeepSeek 官方 provider 凭据（pi 系同源机制，env 注入即被识别）
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
    volumes:
      # ── v3 大脑/现场解耦（2026-09-11 主人拍板）──
      # workspace = 架构师当前服务的目标项目（参数化，随任务切换）：
      #   TARGET_PROJECT=E:\path\to\target docker compose up -d
      - ${TARGET_PROJECT:-../}:/workspace
      # 大脑 = digital-architect 仓，固定挂 /opt/architect 只读；两个写入面单独放行：
      #   architect-knowledge（蒸馏落库）与 docs（方案产出）
      - ..:/opt/architect:ro
      - ../architect-knowledge:/opt/architect/architect-knowledge:rw
      - ../docs:/opt/architect/docs:rw
      # 系统级能力：SKILL 挂 agent 级技能根；检查器以「插件」身份经 omp plugin link
      # 注册（docker/omp/plugins 持久化 link 状态），工具源在 /opt/architect/omp-architect
      # （2026-09-11 起 agent-tools 转发退役，插件为唯一承载）
      - ../skills:/home/pi/.omp/agent/skills:ro
      - ./omp:/home/pi/.omp
      - ./entrypoint.sh:/usr/local/bin/omp-entrypoint.sh
    restart: "unless-stopped"
    stdin_open: true
    tty: true
