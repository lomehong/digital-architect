# =============================================================================
#  oh-my-pi（omp 官方版）— docker-compose.yml
#  官方仓库：https://github.com/can1357/oh-my-pi（omp.sh）
#  Usage:
#    docker compose up -d                          # 常驻（exec 进去跑 omp）
#    docker exec -it oh-my-pi omp                  # 交互 TUI
#    docker compose run --rm omp -p "总结这个项目"   # 一次性任务
# =============================================================================
services:
  omp:
    build:
      context: .
      args:
        # 国内加速默认值在 Dockerfile；如需切官方源或换加速站：
        #   docker compose build --build-arg APT_MIRROR=deb.debian.org --build-arg NPM_REGISTRY=https://registry.npmjs.org
        NODE_IMAGE: ${NODE_IMAGE:-node:24-bookworm-slim}
        APT_MIRROR: ${APT_MIRROR:-mirrors.aliyun.com}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    container_name: oh-my-pi
    environment:
      - TZ=Asia/Shanghai
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      # DeepSeek 官方 provider 凭据（pi 系同源机制，env 注入即被识别）
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
    volumes:
      # 架构师 Agent 工作区 = 本总仓整仓（compose 位于 docker/ 子目录，故挂父目录）
      - ..:/workspace
      - ./omp:/home/pi/.omp
      - ./entrypoint.sh:/usr/local/bin/omp-entrypoint.sh
      # ── 分层只读（2026-09-11 主人拍板）：宿主设施与核心资产对容器内模型只读 ──
      # 模型消费规则，不能改规则；更新路径 = 改仓库 → CI（G3 哈希校验副本一致）→ docker compose up -d 重新生效。
      # 工作对象（architect-knowledge/、docs/）保持可写——蒸馏落库与方案产出是工作流写入面，
      # 由 review-queue + 主人确认 + git 历史兜底。
      - ../.omp:/workspace/.omp:ro
      - ../.claude:/workspace/.claude:ro
      - ../skills:/workspace/skills:ro
      - ../dsh-architect:/workspace/dsh-architect:ro
      - ../adapters:/workspace/adapters:ro
      - ../templates:/workspace/templates:ro
    restart: "unless-stopped"
    stdin_open: true
    tty: true
