# 治理地址簿（跨实例统一治理）：实例 → 台账根
#
# taskRoot 必须是 **observatory 平台所在主机视角** 的路径——平台调 scripts/task-ledger.mjs
# 时直接以它作为 --root。容器实例在容器内看到的路径（如 /workspace）≠ 平台看到的宿主路径，
# 故必须显式登记，平台不猜测、不推导。
#
# 限制（登记）：仅支持平台可访问的本地路径；跨主机实例需要远端执行面（Model B / C3 governor 指令单）。
#
# agentId（可选，Model B 协作转写映射）：实例在 hub.qianji.io 上的御符 agentId——
# 平台 `--yuyi-transcribe`（映射非空自动启用）据此把 Hub 镜像里的协作事实归属到实例。
# 取值须有证据：omp 行来自宿主 ~/.yuyi/agent.json 的 "omp" 条目；dsh 行来自该实例
# platform.identity.verified 真实御符自验事件（2026-09-12）。
