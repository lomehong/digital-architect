<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>观测台 — 架构师团队</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* —— 设计令牌：漆墨观测台 · 朱批 —— */
  :root {
    --ink: #12161F; --ink2: #1A2130; --line: #2A3344;
    --paper: #E8E4DA; --dim: #8B96AC;
    --teal: #56A8A0; --amber: #D9A441; --verm: #E0512F; --verm-deep: #B23A20;
    --sans: "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
    --mono: "Cascadia Mono", Consolas, "Courier New", monospace;
    --kai: KaiTi, "楷体", STKaiti, serif;
  }
  * { box-sizing: border-box }
  html, body { margin: 0; background: var(--ink); color: var(--paper); font-family: var(--sans); font-size: 13px; line-height: 1.55 }
  ::selection { background: var(--verm); color: var(--paper) }

  /* —— 仪表头 —— */
  header { display: flex; align-items: center; gap: 20px; padding: 0 22px; height: 56px; border-bottom: 1px solid var(--line); background: var(--ink2); position: sticky; top: 0; z-index: 5 }
  .brand { display: flex; align-items: center; gap: 10px; white-space: nowrap }
  .seal { width: 9px; height: 9px; border-radius: 50%; background: var(--teal); animation: breathe 2.4s ease-in-out infinite }
  @keyframes breathe { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
  .brand b { font-size: 15px; font-weight: 600; letter-spacing: .06em }
  .brand small { color: var(--dim); font-size: 11px }
  nav { display: flex; gap: 2px; margin-left: 8px; overflow-x: auto }
  nav button { appearance: none; background: none; border: none; border-bottom: 2px solid transparent; color: var(--dim); font: inherit; font-size: 13px; padding: 17px 13px 15px; cursor: pointer; white-space: nowrap }
  nav button:hover { color: var(--paper) }
  nav button.active { color: var(--paper); border-bottom-color: var(--paper) }
  .hright { margin-left: auto; display: flex; align-items: center; gap: 14px; font-family: var(--mono); font-size: 11.5px; color: var(--dim); white-space: nowrap }

  /* —— 仪表读数条 —— */
  #strip { display: flex; flex-wrap: wrap; align-items: center; gap: 0; padding: 0 22px; border-bottom: 1px solid var(--line); font-family: var(--mono); font-size: 12px; color: var(--dim); min-height: 34px }
  #strip .si { display: inline-flex; align-items: center; gap: 7px; padding: 7px 16px 7px 0; margin-right: 16px; border-right: 1px solid var(--line) }
  #strip .si:last-child { border-right: none }
  #strip b { color: var(--paper); font-weight: 600 }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--dim) }
  .dot.on { background: var(--teal) } .dot.warn { background: var(--amber) } .dot.crit { background: var(--verm) }

  #err { color: var(--verm); font-size: 12.5px; padding: 8px 22px 0; font-family: var(--mono) }
  main { padding: 18px 22px 60px; max-width: 1280px }

  /* —— 分区：题签（左竖线承载分区语义）—— */
  h2 { font-size: 15px; font-weight: 600; margin: 30px 0 4px; padding-left: 11px; border-left: 3px solid var(--teal); line-height: 1.3 }
  h2 .sub, .note { color: var(--dim); font-size: 12px; margin: 2px 0 10px 14px }
  .note { margin: 0 0 10px 14px }
  section.blk { margin-top: 8px }
  h3 { font-size: 13px; color: var(--dim); font-weight: 600; margin: 22px 0 6px 14px }

  /* —— 表格：行线仪表，非 Excel —— */
  .tw { overflow-x: auto; margin-left: 14px }
  table { border-collapse: collapse; width: 100%; font-size: 12.5px }
  th { text-align: left; font-weight: normal; color: var(--dim); font-size: 11.5px; padding: 4px 12px 6px 0; border-bottom: 1px solid var(--line); white-space: nowrap }
  td { padding: 6px 12px 6px 0; border-bottom: 1px solid #1F2735; vertical-align: top }
  tbody tr:hover td { background: rgba(91, 175, 166, .05) }
  td.num, th.num { text-align: right; font-family: var(--mono) }
  .mono { font-family: var(--mono); font-size: 11.5px }
  .id { font-family: var(--mono); font-size: 11px; color: var(--dim); word-break: break-all }

  /* —— 语义色（青=正常 缃=注意 朱=危急/治理）—— */
  .ok, .teal { color: var(--teal) } .warn, .amber { color: var(--amber) } .crit, .verm { color: var(--verm) }
  .dim { color: var(--dim) }
  .bdg { display: inline-block; border: 1px solid var(--line); border-radius: 3px; padding: 0 7px; font-size: 11px; font-family: var(--mono); color: var(--dim) }
  .bdg.ok { color: var(--teal); border-color: rgba(86,168,160,.45) }
  .bdg.warn { color: var(--amber); border-color: rgba(217,164,65,.45) }
  .bdg.crit { color: var(--verm); border-color: rgba(224,81,47,.5) }
  code { font-family: var(--mono); font-size: 11.5px; color: var(--teal); background: var(--ink2); padding: 0 5px; border-radius: 3px }

  /* —— 表单与按钮 —— */
  input, select { background: var(--ink2); color: var(--paper); border: 1px solid var(--line); border-radius: 3px; font: inherit; font-size: 12.5px; padding: 5px 9px }
  input:focus-visible, select:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--teal); outline-offset: 1px }
  .btn { appearance: none; background: var(--ink2); color: var(--paper); border: 1px solid var(--line); border-radius: 3px; padding: 5px 14px; cursor: pointer; font: inherit; font-size: 12.5px }
  .btn:hover { border-color: var(--teal) }
  .btn.verm { background: var(--verm); border-color: var(--verm); color: #16090A; font-weight: 600 }
  .btn.verm:hover { background: var(--verm-deep); border-color: var(--verm-deep) }
  .btn.ghost-verm { color: var(--verm); border-color: rgba(224,81,47,.5); background: none }
  .btn.ghost-verm:hover { border-color: var(--verm) }
  a { color: var(--teal); text-decoration: none }
  a:hover { text-decoration: underline }
  pre#out { font-family: var(--mono); font-size: 11.5px; white-space: pre-wrap; color: var(--dim); background: var(--ink2); border: 1px solid var(--line); border-radius: 3px; padding: 10px 12px; margin: 8px 0 0 14px }

  /* —— 朱批台：全页唯一的大胆处 —— */
  .zhupi { background: var(--paper); color: #20242E; border-radius: 3px; padding: 22px 26px 24px; margin: 10px 0 6px 14px }
  .zhupi h1 { font-family: var(--kai); font-size: 26px; font-weight: normal; margin: 0 0 2px; letter-spacing: .12em }
  .zhupi h1 em { font-style: normal; color: var(--verm-deep) }
  .zhupi .zh-note { color: #5A6272; font-size: 12px; margin: 0 0 16px }
  .zhupi label { display: inline-block; font-size: 12px; color: #5A6272; margin: 10px 6px 3px 0 }
  .zhupi input, .zhupi select { background: #FBFAF6; color: #20242E; border-color: #C9C4B6 }
  .zhupi input:focus-visible, .zhupi select:focus-visible { outline-color: var(--verm-deep) }
  .zhupi .row { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: flex-end }
  .zhupi .fld { display: flex; flex-direction: column }
  .zhupi .fld input, .zhupi .fld select { min-width: 0 }
  .zhupi a { color: #8C2B15 }
  .zhupi .note2 { color: #5A6272; font-size: 11.5px; margin: 14px 0 0 }
  .zhupi pre { font-family: var(--mono); font-size: 11.5px; white-space: pre-wrap; background: #F2EFE7; border: 1px solid #D8D3C4; border-radius: 3px; padding: 10px 12px; color: #4A4135; max-height: 260px; overflow: auto }

  .loading { color: var(--dim); padding: 30px 22px }

  @media (max-width: 960px) {
    header { height: auto; flex-wrap: wrap; padding: 8px 14px }
    nav { order: 3; width: 100%; margin: 0 }
    nav button { padding: 10px 12px 8px }
    #strip { padding: 0 14px } main { padding: 14px }
    .zhupi { margin-left: 0; padding: 16px }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important } }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="seal"></span><b>观测台</b><small>架构师团队</small></div>
  <nav>
    <button data-v="team" class="active">团队总览</button>
    <button data-v="systems">系统视图</button>
    <button data-v="instances">实例视图</button>
    <button data-v="collab">协作</button>
    <button data-v="knowledge">知识视图</button>
    <button data-v="govern">治理操作</button>
    <button data-v="runtime">运行时</button>
    <button data-v="events">事件流</button>
  </nav>
  <div class="hright"><span id="clock"></span><span id="gen"></span></div>
</header>
<div id="strip"></div>
<div id="err"></div>
<main id="view"></main>
<script>
const $ = (s) => document.querySelector(s)
let SNAP = null, VIEW = 'team'
const esc = (s) => String(s ?? '').replace(/[&<>]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;' }[c]))
/* 受保护模式的 API 访问：自动携带管理员令牌；401 时提示输入一次并存 sessionStorage 后重试 */
async function api(url, opts = {}) {
  const saved = (typeof sessionStorage !== 'undefined' && sessionStorage.getItem('obs-admin')) || ''
  let r = await fetch(url, { ...opts, headers: { ...(opts.headers || {}), 'x-obs-admin': saved } })
  if (r.status === 401) {
    const t = prompt('此观测台处于受保护模式，请输入管理员令牌：')
    if (t !== null && typeof sessionStorage !== 'undefined') sessionStorage.setItem('obs-admin', t)
    r = await fetch(url, { ...opts, headers: { ...(opts.headers || {}), 'x-obs-admin': t || saved } })
  }
  return r
}
const tickClock = () => { const c = $('#clock'); if (c) c.textContent = new Date().toLocaleTimeString('zh-CN', { hour12: false }) }
setInterval(tickClock, 1000); tickClock()

async function refresh() {
  try {
    const r = await api('/api/snapshot'); SNAP = await r.json()
    $('#err').textContent = SNAP.lastError ? '数据面告警: ' + SNAP.lastError : ''
    $('#gen').textContent = (SNAP.generatedAt || '').slice(11, 19)
    render()
    // 健康信息（独立端点，失败静默）
    api('/api/health').then((x) => x.json()).then((h) => {
      const el = document.getElementById('health')
      if (el) el.innerHTML = `pid <b>${h.pid}</b>　运行 ${h.uptimeSec}s　告警规则 ${h.alertRules} 条<br>数据源 ${Object.entries(h.sources).map(([k, v]) => `<span class="${v === 'ok' ? 'teal' : v === 'disabled' ? 'dim' : 'crit'}">${k} ${v === 'ok' ? '✅' : v === 'disabled' ? '—' : '❌'}</span>`).join('　')}`
    }).catch(() => {})
    // 审计归档状态
    api('/api/archive').then((x) => x.json()).then((a) => {
      const el = document.getElementById('archive')
      if (!el) return
      el.innerHTML = a.seals === 0 ? (a.note || '尚无封印') : `封印 <b>${a.seals}</b> 条　链完整性 <span class="${a.chainOk ? 'teal' : 'crit'}">${a.chainOk ? '✅ 完好' : '❌ 断裂'}</span><br>最近 ${a.last.day}${a.last.closed ? '（闭日·严格）' : '（当日·检查点）'}　${a.last.files} 文件 / ${a.last.bytes} 字节${a.note ? '　' + a.note : ''}`
    }).catch(() => {})
  } catch (e) { $('#err').textContent = '快照获取失败: ' + e.message }
}

/* 仪表读数条：一眼判断团队是否安好 */
function renderStrip() {
  const el = $('#strip'); if (!SNAP || !el) return
  const on = SNAP.instances.filter((i) => i.status === 'online').length
  const alerts = (SNAP.alerts || []).length
  const pend = (SNAP.pendingApprovals || []).length
  const open = Object.values(SNAP.tasks || {}).filter((t) => t.state !== '已落定').length
  const item = (dot, label, val, cls) => `<span class="si"><span class="dot ${dot}"></span>${label} <b class="${cls || ''}">${val}</b></span>`
  el.innerHTML =
    item(on === SNAP.instances.length ? 'on' : 'warn', '实例在线', `${on}/${SNAP.instances.length}`) +
    item(alerts ? 'crit' : 'on', '告警', alerts, alerts ? 'crit' : '') +
    item(pend ? 'warn' : 'on', '待审批', pend, pend ? 'amber' : '') +
    item('on', '未落定任务', open) +
    `<span class="si">快照 <b>${esc((SNAP.generatedAt || '').slice(11, 19))}</b></span>`
}

/* 统一分区包装：题签 + 说明 + 表格 */
const blk = (title, note, body) => `<section class="blk"><h2>${title}</h2>${note ? `<p class="note">${note}</p>` : ''}${body}</section>`
const tw = (head, rows, emptyCols, emptyText) => `<div class="tw"><table><thead><tr>${head}</tr></thead><tbody>${rows || `<tr><td colspan="${emptyCols}" class="dim">${emptyText}</td></tr>`}</tbody></table></div>`

function render() {
  const v = $('#view'); if (!SNAP) { v.innerHTML = '<p class="loading">正在读取团队快照…</p>'; return }
  renderStrip()
  // 身份自验证据索引（团队/实例视图共用）
  const idRows = {}
  for (const r of ((SNAP.identity || {}).rows || [])) idRows[r.instanceId] = r
  const idText = (r) => (!r || r.state === '未申报')
    ? '身份未申报——实例尚未上报自验证据；平台不做身份验证'
    : `御符 ${r.identityId}　Owner ${r.owner || '—'}　角色 ${r.role || '未设置'}　权限 ${r.permissions.length} 项　经 ${r.via} 验证于 ${r.checkedAt}${typeof r.ageSec === 'number' ? `（${r.ageSec}s 前）` : ''}${r.reason ? '　' + r.reason : ''}`
  if (VIEW === 'team') {
    const idBadge = (r) => !r || r.state === '未申报' ? '<span class="dim">未申报</span>'
      : r.state === '已验证' ? '<span class="ok">✅ 已验证</span>' : '<span class="crit">❌ 失效</span>'
    const inst = SNAP.instances.map((i) => {
      const r = idRows[i.instanceId]
      return `<tr><td class="mono">${esc(i.instanceId)}</td><td>${esc(i.hostType)}</td><td class="dim">${esc(i.systems.join(', '))}</td><td><span class="dot ${i.status === 'online' ? 'on' : 'warn'}"></span> ${esc(i.status)}</td><td>${idBadge(r)}${r && r.drift ? `<br><span class="crit">${esc(r.drift)}</span>` : ''}${r && r.identityId ? `<br><span class="id">${esc(r.identityId)}</span>` : ''}</td><td class="dim mono">${esc(i.lastSeenAt)}</td></tr>`
    }).join('')
    const idt = (SNAP.identity || {}).totals || {}
    const alerts = SNAP.alerts.map((e) => `<tr><td class="crit mono">${esc(e.type)}</td><td>${esc(e.subject)}</td><td class="dim mono">${esc(e.ts)}</td></tr>`).join('')
    const pend = SNAP.pendingApprovals || []
    v.innerHTML =
      blk('实例', `身份自验三态：已验证 <b class="teal">${idt.verified ?? 0}</b>　失效 <b class="${(idt.failed ?? 0) > 0 ? 'crit' : 'dim'}">${idt.failed ?? 0}</b>　未申报 <b class="dim">${idt.unreported ?? 0}</b>　——平台不做身份验证，仅存档实例侧 <code>yufu_verify</code> 证据`,
        tw('<th>实例（御符）</th><th>宿主</th><th>负责系统</th><th>状态</th><th>身份（自验）</th><th>心跳</th>', inst, 6, '暂无注册实例')) +
      blk('审批代办', pend.length ? '以下操作等待你批准，超时将自动拒绝' : '', pend.length === 0 ? '<p class="note dim" style="margin-left:14px">无挂单</p>' :
        tw('<th>实例</th><th>工具</th><th>原因</th><th>截止</th><th>决定</th>',
          pend.map((p) => `<tr><td class="mono">${esc(p.instanceId)}<br><span class="id">${esc(p.requestId)}</span></td><td class="mono">${esc(p.tool || '-')}</td><td>${esc(p.reason || '-')}</td><td class="mono ${Date.parse(p.requiredBy) < Date.now() ? 'crit' : 'dim'}">${esc(p.requiredBy)}</td><td><button class="btn ghost-verm" onclick="approv('${esc(p.requestId)}','allow')">批准</button> <button class="btn" onclick="approv('${esc(p.requestId)}','deny')">拒绝</button></td></tr>`).join(''), 5, '无挂单')) +
      blk('告警', '', (SNAP.alerts || []).length === 0 ? '<p class="note teal" style="margin-left:14px">✅ 无告警</p>' :
        tw('<th>级别</th><th>告警</th><th>状态</th>', SNAP.alerts.map((a) => `<tr><td class="${a.severity === 'critical' ? 'crit' : 'amber'} mono">${esc(a.severity)}</td><td><b>${esc(a.title)}</b><br><span class="dim">${esc(a.message || '')}</span></td><td>${a.suppressed ? '<span class="dim">抑制中</span>' : `<span class="amber">新触发</span>${a.firedCount > 1 ? ` <span class="dim">×${a.firedCount}</span>` : ''}`}</td></tr>`).join(''), 3, '无')) +
      blk('审计归档（哈希链封印）', '', '<p class="note dim mono" id="archive" style="margin-left:14px">加载中…</p>') +
      blk('健康', '', '<p class="note dim mono" id="health" style="margin-left:14px">加载中…</p>') +
      blk('治理留痕（最近）', '', tw('<th>动作</th><th>主体</th><th>经手</th><th>时间</th>', SNAP.governance.map((e) => `<tr><td class="mono">${esc(e.type)}</td><td>${esc(e.subject)}</td><td class="dim">${esc((e.payload || {}).via)}</td><td class="dim mono">${esc(e.ts)}</td></tr>`).join(''), 4, '无'))
  } else if (VIEW === 'systems') {
    const bySys = {}
    for (const i of SNAP.instances) for (const s of i.systems) (bySys[s] = bySys[s] || { instances: [], tasks: {} })
    for (const [id, t] of Object.entries(SNAP.tasks || {})) { (bySys[t.system] = bySys[t.system] || { instances: [], tasks: {} }).tasks[id] = t }
    v.innerHTML = Object.keys(bySys).map((s) => {
      const g = bySys[s]
      const tasks = Object.entries(g.tasks).map(([id, t]) => `<tr><td class="mono">${esc(id)}</td><td>${esc(t.state)}</td><td class="dim">${esc(t.by)}</td></tr>`).join('')
      return blk(`系统：${esc(s)}`, `负责实例：${esc(g.instances.join(', ') || '（未登记实例归属）')}`, tw('<th>任务</th><th>状态</th><th>经手</th>', tasks, 3, '无任务事件'))
    }).join('') || '<p class="loading">尚无系统数据</p>'
  } else if (VIEW === 'instances') {
    v.innerHTML = SNAP.instances.map((i) => {
      const evs = SNAP.events.filter((e) => e.instanceId === i.instanceId).slice(-15).reverse()
        .map((e) => `<tr><td class="dim mono">${esc(e.ts)}</td><td class="mono">${esc(e.domain)}/${esc(e.type)}</td><td class="${e.severity === 'critical' ? 'crit' : e.severity === 'warning' ? 'amber' : 'dim'}">${esc(e.severity)}</td><td>${esc(e.subject ?? '')}</td></tr>`).join('')
      const idr = idRows[i.instanceId]
      const idCls = idr && idr.state === '已验证' ? 'teal' : (idr && idr.state === '失效' ? 'crit' : 'dim')
      return blk(`${esc(i.instanceId)}　<span class="bdg ${i.status === 'online' ? 'ok' : 'warn'}">${i.status}</span>`,
        `宿主 ${esc(i.hostType)}　负责 ${esc(i.systems.join(', '))}　心跳间隔 ${i.heartbeatIntervalSec}s<br><span class="${idCls}">${esc(idText(idr))}${idr && idr.drift ? ` — <span class="crit">${esc(idr.drift)}</span>` : ''}</span>`,
        tw('<th>时间</th><th>事件</th><th>级别</th><th>主体</th>', evs, 4, '无事件'))
    }).join('') || '<p class="loading">暂无实例</p>'
  } else if (VIEW === 'collab') {
    const c = SNAP.collab || { peers: [], totals: {} }
    const t = c.totals || {}
    const roleLabel = (r) => r === 'avatar' ? 'avatar（主人数字分身）' : (r || '未设置')
    const rows = (c.peers || []).map((p) => `<tr>
      <td>${p.identityVerified ? esc(p.agentId) : '<span class="amber">未验证</span>'}
        <br><span class="dim">${esc(p.name || '')}${p.device ? ' @ ' + esc(p.device) : ''}</span></td>
      <td>${esc(p.owner || '—')}<br><span class="dim">${esc(roleLabel(p.role))}</span></td>
      <td class="num">↓${p.inbound}　↑${p.outbound}</td>
      <td class="dim">${esc(Object.keys(p.systems || {}).join(', '))}</td>
      <td class="dim mono">${esc(p.lastTs)}${p.lastSubject ? '<br>' + esc(p.lastSubject) : ''}</td>
      <td>${p.identityVerified ? '<span class="teal">✅ Hub 回填</span>' : '<span class="amber">⚠️ 身份未验证</span>'}</td></tr>`).join('')
    const denied = (SNAP.events || []).filter((e) => String(e.type).startsWith('collab.gate-denied')).slice(-20).reverse()
      .map((e) => `<tr><td class="dim mono">${esc(e.ts)}</td><td>${esc(e.subject ?? '')}</td><td class="amber mono">${esc(e.decision)}</td><td class="dim">${esc(e.reason || '')}</td></tr>`).join('')
    const msgs = (SNAP.events || []).filter((e) => String(e.type).startsWith('collab.message')).slice(-25).reverse()

function pickRoot() {
  const r = (SNAP.roots || []).find((x) => x.instanceId === $('#g-inst').value)

}
function fillTask(id) {
  const el = $('#g-task'); const cur = el.value.trim()
  el.value = cur === '' ? id : (cur.split(/[,\s]+/).includes(id) ? cur : cur + ', ' + id)
}
async function gDispatch(sub) {
  const ids = $('#g-task').value.split(/[,\s]+/).map((s) => s.trim()).filter(Boolean)
  const inst = $('#g-inst').value.trim(), root = $('#g-root').value.trim(), by = ($('#g-by').value || '').trim()
  if (!inst || !ids.length || !root || !by) { $('#g-out').textContent = '发单需：实例（下拉选择）/ 任务号 / 台账根（实例宿主视角路径）/ 操作者'; return }
  if (!confirm(`发跨宿主指令单：${inst} 对 ${ids.join(', ')} 执行 ${sub.toUpperCase()}？\nroot = ${root}\n（governor 领单后本地执行并回执；单号幂等）`)) return
  let acc = ''
  for (const taskId of ids) {
    try {
      // confirmReal：人工已在 confirm 对话框二次确认（与本地治理同一纪律）
      const r = await api('/api/govern/dispatch', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ instanceId: inst, action: 'task-ledger', sub, taskId, root, by, confirmReal: true }) })
      const j = await r.json()
      acc += `${j.ok ? '📨 已发单' : '❌'} ${taskId}：${j.id ?? j.error}\n`
    } catch (e) { acc += `❌ ${taskId}：${e.message}\n` }
  }
  window._govResult = acc; $('#g-out').textContent = acc; refresh()
}
async function gDispatchDoc() {
  const inst = $('#g-inst').value.trim(), by = ($('#g-by').value || '').trim()
  const file = $('#g-doc-file').value.trim(), from = $('#g-doc-from').value.trim(), to = $('#g-doc-to').value.trim()
  if (!inst || !by || !file || !to) { $('#g-out').textContent = '文档发单需：实例 / 操作者 / 文件路径（宿主视角，须在 governor --allow-root 内）/ 目标 status'; return }
  if (!confirm(`发跨宿主指令单：${inst} 将 ${file} 的 status 改为「${to}」？`)) return
  const r = await api('/api/govern/dispatch', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ instanceId: inst, action: 'doc-status', file, from: from || undefined, to, by, confirmReal: true }) })
  const j = await r.json()
  window._govResult = `${j.ok ? '📨 已发单' : '❌'}：${j.id ?? j.error}\n`; $('#g-out').textContent = window._govResult; refresh()
}
async function govern(action) {
  const ids = $('#g-task').value.split(/[,\s]+/).map((s) => s.trim()).filter(Boolean)
  const root = $('#g-root').value.trim()
  const by = ($('#g-by').value || '').trim()
  if (ids.length === 0) { $('#g-out').textContent = '请先填任务号（可逗号分隔批量）'; return }
  if (by === '') { $('#g-out').textContent = '请先填「操作者」——平台不代填「主人」，confirm 只能由主人发起'; return }
  if (!confirm(`以「${by}」的名义，对 ${ids.length} 个任务执行 ${action.toUpperCase()}？\n${ids.join('\n')}\nroot = ${root}\n（逐个调用 ledger，各自留痕；部分失败逐条报告）`)) return
  let acc = ''
  for (const taskId of ids) {
    try {
      // confirmReal: 人工已在上方 confirm 对话框二次确认；脚本路径须自行显式携带（服务端据此拦自动化误写）
      const r = await api('/api/govern/task', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ taskId, root, action, by, confirmReal: true }) })
      const j = await r.json()
      const msg = String(j.out ?? j.error ?? JSON.stringify(j)).trim().split('\n').filter(Boolean).pop()
      acc += `${j.ok ? '✅' : '❌'} ${taskId}：${msg}\n`
    } catch (e) { acc += `❌ ${taskId}：${e.message}\n` }
    window._govResult = acc
    $('#g-out').textContent = acc
  }
  refresh()
}
async function kPromote() {
  const entry = $('#k-entry').value.trim(); if (!entry) return
  const by = ($('#g-by').value || '').trim()
  if (by === '') { window._govResult = '请先填「操作者」（平台不代填「主人」）'; $('#g-out').textContent = window._govResult; return }
  if (!confirm(`以「${by}」的名义将 ${entry} 升级为「已确认」？（将留治理审计）`)) return
  const r = await api('/api/govern/knowledge', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ entry, to: '已确认', by }) })
  const j = await r.json(); window._govResult = j.ok ? `✅ 已升级：${entry}` : `❌ ${j.error ?? '失败'}`; $('#g-out').textContent = window._govResult; refresh()
}
async function approv(requestId, decision) {
  const by = (prompt(`以谁的名义${decision === 'allow' ? '批准' : '拒绝'}？（操作者标识，必填——平台不代填「主人」）`) || '').trim()
  if (by === '') { alert('必须提供操作者标识（平台不代填「主人」）'); return }
  const reason = prompt(`${decision === 'allow' ? '批准' : '拒绝'}理由（可空）：`) || ''
  if (!confirm(`以「${by}」的名义对 ${requestId} 执行 ${decision.toUpperCase()}？（将留治理审计）`)) return
  const r = await api('/api/govern/approval', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ requestId, decision, by, reason }) })
  const j = await r.json(); window._govResult = j.ok ? `✅ 已${decision === 'allow' ? '批准' : '拒绝'}：${requestId}` : `❌ ${j.error ?? '失败'}`; $('#g-out').textContent = window._govResult; refresh()
}
/* 视图切换：hash 深链——刷新 / 前进后退均保持当前视图（#govern 可直达朱批台） */
const VIEWS = ['team', 'systems', 'instances', 'collab', 'knowledge', 'govern', 'runtime', 'events']
function setView(v) {
  VIEW = VIEWS.includes(v) ? v : 'team'
  document.querySelectorAll('nav button').forEach((x) => x.classList.toggle('active', x.dataset.v === VIEW))
  render()
}
document.querySelectorAll('nav button').forEach((b) => b.onclick = () => { location.hash = b.dataset.v })
window.addEventListener && window.addEventListener('hashchange', () => setView((location.hash || '').slice(1)))
setView((location.hash || '').slice(1))
document.addEventListener('change', (e) => { if (e.target && e.target.id === 'ev-filter') { window._evFilter = e.target.value; render() } })
refresh(); setInterval(refresh, 10000)
</script>
