# =============================================================================
#  oh-my-pi（omp 官方版）— docker-compose.yml
#  官方仓库：https://github.com/can1357/oh-my-pi（omp.sh）
#  Usage:
#    docker compose up -d                                  # 常驻（配置变更后重建容器生效）
#    docker exec -it -u pi oh-my-pi omp                    # 交互 TUI（**必须 -u pi**：
#                                                          #  root 的 agent 目录不同 → 工具面缺失）
#    docker compose run --rm omp -p "一次性任务"            # 无头单命令（同样建议加 -u pi）
#    切换现场：.env 改 TARGET_PROJECT=<目标项目> → up -d
#    首次部署：cp .env.example .env 后填值（模板可签入 git；真实 .env 已被 gitignore）
#    知识库校验兜底：node /opt/architect/dsh-architect/scripts/lint-knowledge.mjs /opt/architect/architect-knowledge
#  插件：omp-architect 经 `omp plugin link /opt/architect/omp-architect` 注册（已持久化，
#        工具面由此承载）；升级 = 改仓库 push，容器内即时生效，无需重装。
# =============================================================================
services:
  omp:
    build:
      context: .
      args:
        # 国内加速默认值在 Dockerfile；如需切官方源或换加速站：
        #   docker compose build --build-arg APT_MIRROR=deb.debian.org --build-arg NPM_REGISTRY=https://registry.npmjs.org
        NODE_IMAGE: ${NODE_IMAGE:-node:24-bookworm-slim}
        APT_MIRROR: ${APT_MIRROR:-mirrors.aliyun.com}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    container_name: oh-my-pi
    environment:
      - TZ=Asia/Shanghai
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - KB_ROOT=/opt/architect/architect-knowledge
      # DeepSeek 官方 provider 凭据（pi 系同源机制，env 注入即被识别）
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      # 智谱 GLM Coding Plan（zhipu-coding-plan provider；.env 填 key 后重建容器生效）
      - ZHIPU_API_KEY=${ZHIPU_API_KEY:-}
      # Z.AI 国际版套餐（备用）
      - ZAI_API_KEY=${ZAI_API_KEY:-}
      # GitHub 凭证（gh CLI 原生识别 GH_TOKEN；git 私有仓经 entrypoint 配的 credential helper 免密）
      # 建议细粒度 PAT：仅授权目标仓库的 contents 读写
      - GH_TOKEN=${GH_TOKEN:-}
      # ── 御驿 Yuyi 通信平面（yuyi-pi-extension 自动加载自 /home/pi/.omp/agent/extensions/）──
      # agent 身份 = 宿主 ~/.yuyi/agent.json 的 omp 条目（.env 注入；扩展自行调御符验证）
      - YUYI_TOKEN=${YUYI_AGENT_TOKEN:-}
      - YUYI_YUFU_URL=${YUYI_YUFU_URL:-}
      - YUYI_HUB=${YUYI_HUB:-}
      - YUYI_DEVICE=${YUYI_DEVICE:-oh-my-pi}
      - YUYI_ALIAS=${YUYI_ALIAS:-omp-docker}
      # ── browser-acceptance 验收栈（2026-09-25）──
      # BA_ROOT = 运行时根（venv/权重/chrome profile/证据），落在 ba-root 命名卷上持久化；
      # 首次部署在容器内跑 bash /opt/architect/browser-acceptance/deploy.sh（幂等，含权重 sha256 门禁）
      - BA_ROOT=/home/pi/.browser-acceptance
      # HF 直连不可用时经镜像（deploy.sh 已内置禁 xet）
      - HF_ENDPOINT=${HF_ENDPOINT:-}
      # 容器内 PyPI 加速（deploy.sh 读取；tuna simple 注意：Linux torch 轮带 CUDA 依赖）
      - PIP_INDEX_URL=${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
      - TORCH_INDEX=${TORCH_INDEX:-}
    volumes:
      # ── v3.2 白名单挂载（2026-09-11 主人否决整仓挂载，D11 同批）──
      # workspace = 架构师当前服务的目标项目——**必须显式设置，无默认回退**：
      # 默认回退 ../ 会把大脑仓本体（含 .git 与 docker/.env 密钥）rw 挂为现场（2026-09-14 审计修正）
      - ${TARGET_PROJECT:?未设置 TARGET_PROJECT——请在 docker/.env 指定架构师服务的目标项目}:/workspace
      # 大脑仓【不整仓挂载】：仅按职责白名单——
      #   规则面（ro）：skills / templates / adapters / packages(核心) / dsh-architect / omp-architect
      #   写入面（rw）：architect-knowledge（蒸馏落库，唯一写通道）；工作产出落目标项目 docs/（workspace 天然 rw）
      # 不进容器：.git（历史）、.github、scripts、docker（**密钥 .env 物理隔离**）、.claude、.omp、dsh-yuyi
      - ../architect-knowledge:/opt/architect/architect-knowledge:rw
      - ../skills:/opt/architect/skills:ro
      - ../templates:/opt/architect/templates:ro
      - ../adapters:/opt/architect/adapters:ro
      - ../packages:/opt/architect/packages:ro
      - ../dsh-architect:/opt/architect/dsh-architect:ro
      - ../omp-architect:/opt/architect/omp-architect:ro
      # 任务面契约的 omp 实现（文件台账 CLI）——单文件精确挂载（2026-09-14 主人拍板 a；
      # v3.2 排除 scripts/ 整目录，本行是唯一例外，避免把 brain scripts 整体暴露给容器）
      - ../scripts/task-ledger.mjs:/opt/architect/scripts/task-ledger.mjs:ro
      # 观测工具面（ro）：yuyi-transcribe 等实例侧上报工具（entrypoint 按需启停）
      - ../observatory:/opt/architect/observatory:ro
      # 浏览器 E2E 验收能力包（ro，2026-09-25 落定；运行时状态走 ba-root 卷，见 BA_ROOT）
      - ../browser-acceptance:/opt/architect/browser-acceptance:ro
      # ── Architect Observatory：实例上报通道（rw；观测平面数据根）──
      - ../obs:/opt/architect/obs:rw
      # 系统级能力：SKILL 挂 agent 级技能根；检查器以「插件」身份经 omp plugin link
      # 注册（docker/omp/plugins 持久化 link 状态），工具源在 /opt/architect/omp-architect
      # （2026-09-11 起 agent-tools 转发退役，插件为唯一承载）
      - ../skills:/home/pi/.omp/agent/skills:ro
      # 规则面补充：AGENTS.md 挂用户级规则根（omp 每轮自动读取；内容=架构师身份/流程/纪律）
      - ../AGENTS.md:/home/pi/.omp/agent/AGENTS.md:ro
      - ./omp:/home/pi/.omp
      - ./entrypoint.sh:/usr/local/bin/omp-entrypoint.sh
      # browser-acceptance 运行时持久卷（venv/权重/chrome profile/evidence；重建容器不丢）
      - ba-root:/home/pi/.browser-acceptance
    restart: "unless-stopped"
    stdin_open: true
    tty: true
    networks:
      - omp-net

# ── 网段冲突背景（2026-09-14 主人）──
# 公司办公网使用 172.17.x.x ~ 172.31.x.x，Docker 默认 bridge（172.17.0.0/16）
# 与之路由冲突：职场无法 SSH 到虚拟机、虚拟机间通信异常；且 daemon.json 的 bip
# 管不住 compose 自动建网——必须在此显式声明编排网段。
# 配置标准：daemon 默认 bridge = 10.249.249.1/24（宿主 daemon.json）；本编排 = 10.249.247.0/24。
networks:
  omp-net:
    name: omp-architect-net
    driver: bridge
    ipam:
      config:
        - subnet: 10.249.247.0/24
          gateway: 10.249.247.1

volumes:
  ba-root:
    name: omp-browser-acceptance
