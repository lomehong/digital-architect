<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Architect Observatory — 架构师团队可观测性平面</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#0d1117; --panel:#161b22; --fg:#e6edf3; --dim:#8b949e; --ok:#3fb950; --warn:#d29922; --crit:#f85149; --line:#30363d; --acc:#58a6ff }
  * { box-sizing:border-box; font-family:Consolas,'Cascadia Mono',monospace }
  body { margin:0; background:var(--bg); color:var(--fg) }
  header { padding:14px 20px; border-bottom:1px solid var(--line); display:flex; gap:24px; align-items:baseline }
  header h1 { font-size:16px; margin:0 }
  header .sub { color:var(--dim); font-size:12px }
  nav { display:flex; gap:4px; margin-left:auto }
  nav button { background:none; border:1px solid var(--line); color:var(--dim); padding:5px 12px; cursor:pointer; font-size:12px }
  nav button.active { color:var(--acc); border-color:var(--acc) }
  main { padding:16px 20px }
  h2 { font-size:13px; color:var(--acc); margin:18px 0 8px }
  table { border-collapse:collapse; width:100%; font-size:12px }
  th, td { border:1px solid var(--line); padding:5px 9px; text-align:left }
  th { color:var(--dim); font-weight:normal }
  .ok { color:var(--ok) } .warn { color:var(--warn) } .crit { color:var(--crit) } .dim { color:var(--dim) }
  .pill { display:inline-block; padding:1px 8px; border:1px solid var(--line); border-radius:9px; font-size:11px }
  .btn { background:#21262d; color:var(--fg); border:1px solid var(--line); padding:3px 10px; cursor:pointer; font-size:11px; margin-right:4px }
  .btn:hover { border-color:var(--acc) }
  #err { color:var(--crit); font-size:12px; padding:0 20px }
</style>
</head>
<body>
<header>
  <h1>◉ Architect Observatory</h1>
  <span class="sub">架构师团队可观测性平面 · <span id="gen"></span></span>
  <nav>
    <button data-v="team" class="active">团队总览</button>
    <button data-v="systems">系统视图</button>
    <button data-v="instances">实例视图</button>
    <button data-v="collab">协作</button>
    <button data-v="knowledge">知识视图</button>
    <button data-v="govern">治理操作</button>
    <button data-v="runtime">运行时</button>
    <button data-v="events">事件流</button>
  </nav>
</header>
<div id="err"></div>
<main id="view"></main>
<script>
const $ = (s) => document.querySelector(s)
let SNAP = null, VIEW = 'team'
const esc = (s) => String(s ?? '').replace(/[&<>]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;' }[c]))
async function refresh() {
  try {
    const r = await fetch('/api/snapshot'); SNAP = await r.json()
    $('#err').textContent = SNAP.lastError ? '数据面告警: ' + SNAP.lastError : ''
    $('#gen').textContent = SNAP.generatedAt
    render()
    // 健康信息（独立端点，失败静默）
    fetch('/api/health').then((x) => x.json()).then((h) => {
      const el = document.getElementById('health')
      if (el) el.textContent = `pid ${h.pid} · 运行 ${h.uptimeSec}s · 告警规则 ${h.alertRules} 条 · 数据源 ${Object.entries(h.sources).map(([k, v]) => k + ':' + (v === 'ok' ? '✅' : v === 'disabled' ? '—' : '❌')).join(' ')}`
    }).catch(() => {})
    // 审计归档状态
    fetch('/api/archive').then((x) => x.json()).then((a) => {
      const el = document.getElementById('archive')
      if (!el) return
      el.textContent = a.seals === 0 ? (a.note || '尚无封印') : `封印 ${a.seals} 条 · 链完整性 ${a.chainOk ? '✅ 完好' : '❌ 断裂'} · 最近 ${a.last.day}${a.last.closed ? '（闭日·严格）' : '（当日·检查点）'} ${a.last.files} 文件 / ${a.last.bytes} 字节 · ${a.note || ''}`
    }).catch(() => {})
  } catch (e) { $('#err').textContent = '快照获取失败: ' + e.message }
}
function render() {
  const v = $('#view'); if (!SNAP) { v.innerHTML = '<p class="dim">加载中…</p>'; return }
  // 身份自验证据索引（团队/实例视图共用）
  const idRows = {}
  for (const r of ((SNAP.identity || {}).rows || [])) idRows[r.instanceId] = r
  const idText = (r) => (!r || r.state === '未申报')
    ? '身份未申报（实例未上报自验证据；平台不做身份验证）'
    : `御符 ${r.identityId} · Owner ${r.owner || '—'} · 角色 ${r.role || '未设置'} · 权限 ${r.permissions.length} 项 · 经 ${r.via} 验证于 ${r.checkedAt}${typeof r.ageSec === 'number' ? `（${r.ageSec}s 前）` : ''}${r.reason ? ' · ' + r.reason : ''}`
  if (VIEW === 'team') {
    const idBadge = (r) => !r || r.state === '未申报' ? '<span class="dim">未申报</span>'
      : r.state === '已验证' ? '<span class="ok">✅ 已验证</span>' : '<span class="crit">❌ 失效</span>'
    const inst = SNAP.instances.map((i) => {
      const r = idRows[i.instanceId]
      return `<tr><td>${esc(i.instanceId)}</td><td>${esc(i.hostType)}</td><td>${esc(i.systems.join(', '))}</td><td class="${i.status === 'online' ? 'ok' : 'warn'}">${i.status}</td><td>${idBadge(r)}${r && r.drift ? `<br><span class="crit">${esc(r.drift)}</span>` : ''}${r && r.identityId ? `<br><span class="dim">${esc(r.identityId)}</span>` : ''}</td><td class="dim">${esc(i.lastSeenAt)}</td></tr>`
    }).join('')
    const idt = (SNAP.identity || {}).totals || {}
    const alerts = SNAP.alerts.map((e) => `<tr><td class="crit">${esc(e.type)}</td><td>${esc(e.subject)}</td><td class="dim">${esc(e.ts)}</td></tr>`).join('')
    v.innerHTML = `<h2>实例</h2>
      <p class="dim">身份自验（§7.1 三态之「自验」）：已验证 <b class="ok">${idt.verified ?? 0}</b> · 失效 <b class="${(idt.failed ?? 0) > 0 ? 'crit' : 'dim'}">${idt.failed ?? 0}</b> · 未申报 <b class="dim">${idt.unreported ?? 0}</b> —— 平台不做身份验证，仅存档实例侧 <code>yufu_verify</code> 证据。</p>
      <table><tr><th>实例(御符)</th><th>宿主</th><th>负责系统</th><th>状态</th><th>身份（自验）</th><th>心跳</th></tr>${inst || '<tr><td colspan=6 class=dim>暂无注册实例</td></tr>'}</table>
      <h2>最近 critical 事件</h2><table><tr><th>类型</th><th>主体</th><th>时间</th></tr>${alerts || '<tr><td colspan=3 class=dim>无</td></tr>'}</table>
      <h2>告警</h2>
      ${(SNAP.alerts||[]).length === 0 ? '<p class=ok>✅ 无告警</p>' : `<table><tr><th>级别</th><th>告警</th><th>状态</th></tr>${SNAP.alerts.map((a) => `<tr><td class="${a.severity==='critical'?'crit':'warn'}">${esc(a.severity)}</td><td><b>${esc(a.title)}</b><br><span class=dim>${esc(a.message||'')}</span></td><td>${a.suppressed?'<span class=dim>抑制中</span>':('<span class=warn>新触发</span>'+(a.firedCount>1?` <span class=dim>×${a.firedCount}</span>`:''))}</td></tr>`).join('')}</table>`}
      <h2>审计归档（哈希链封印）</h2>
      <p class=dim id=archive>加载中…</p>
      <h2>健康</h2>
      <p class=dim id=health>加载中…</p>
      <h2>审批代办（pending）</h2>
      ${(SNAP.pendingApprovals||[]).length === 0 ? '<p class=dim>无挂单</p>' : `<table><tr><th>实例</th><th>工具</th><th>原因</th><th>截止</th><th>批准 / 拒绝</th></tr>${SNAP.pendingApprovals.map((p) => `<tr><td>${esc(p.instanceId)}<br><span class=dim>${esc(p.requestId)}</span></td><td>${esc(p.tool||'-')}</td><td>${esc(p.reason||'-')}</td><td class=${Date.parse(p.requiredBy)<Date.now()?'crit':'dim'}>${esc(p.requiredBy)}</td><td><button class=btn onclick="approv('${esc(p.requestId)}','allow')">批准</button><button class=btn onclick="approv('${esc(p.requestId)}','deny')">拒绝</button></td></tr>`).join('')}</table>`}
      <h2>治理留痕（最近）</h2><table><tr><th>动作</th><th>主体</th><th>经手</th><th>时间</th></tr>${SNAP.governance.map((e) => `<tr><td>${esc(e.type)}</td><td>${esc(e.subject)}</td><td>${esc((e.payload||{}).via)}</td><td class="dim">${esc(e.ts)}</td></tr>`).join('') || '<tr><td colspan=4 class=dim>无</td></tr>'}</table>`
  } else if (VIEW === 'systems') {
    const bySys = {}
    for (const i of SNAP.instances) for (const s of i.systems) (bySys[s] = bySys[s] || { instances: [], tasks: {} })
    for (const [id, t] of Object.entries(SNAP.tasks || {})) { (bySys[t.system] = bySys[t.system] || { instances: [], tasks: {} }).tasks[id] = t }
    v.innerHTML = Object.keys(bySys).map((s) => {
      const g = bySys[s]
      const tasks = Object.entries(g.tasks).map(([id, t]) => `<tr><td>${esc(id)}</td><td>${esc(t.state)}</td><td class="dim">${esc(t.by)}</td></tr>`).join('') || '<tr><td colspan=3 class=dim>无任务事件</td></tr>'
      return `<h2>系统：${esc(s)}</h2><p class="dim">负责实例：${esc(g.instances.join(', ') || '（未登记实例归属）')}</p><table><tr><th>任务</th><th>状态</th><th>经手</th></tr>${tasks}</table>`
    }).join('') || '<p class="dim">尚无系统数据</p>'
  } else if (VIEW === 'instances') {
    v.innerHTML = SNAP.instances.map((i) => {
      const evs = SNAP.events.filter((e) => e.instanceId === i.instanceId).slice(-15).reverse()
        .map((e) => `<tr><td class="dim">${esc(e.ts)}</td><td>${esc(e.domain)}/${esc(e.type)}</td><td>${esc(e.severity)}</td><td>${esc(e.subject ?? '')}</td></tr>`).join('')
      const idr = idRows[i.instanceId]
      return `<h2>${esc(i.instanceId)} <span class="pill ${i.status === 'online' ? 'ok' : 'warn'}">${i.status}</span></h2>
        <p class="dim">宿主 ${esc(i.hostType)} · 负责 ${esc(i.systems.join(', '))} · 心跳间隔 ${i.heartbeatIntervalSec}s</p>
        <p class="${idr && idr.state === '已验证' ? 'ok' : (idr && idr.state === '失效' ? 'crit' : 'dim')}">${esc(idText(idr))}${idr && idr.drift ? ` — <span class="crit">${esc(idr.drift)}</span>` : ''}</p>
        <table><tr><th>时间</th><th>事件</th><th>级别</th><th>主体</th></tr>${evs || '<tr><td colspan=4 class=dim>无事件</td></tr>'}</table>`
    }).join('') || '<p class="dim">暂无实例</p>'
  } else if (VIEW === 'events') {
    const items = (SNAP.events || []).slice(-60).reverse()
    v.innerHTML = `<h2>事件实时流（最近 60 条，10s 自动刷新）</h2>
      <p class="dim">实例 <select id="ev-filter" onchange="render()"><option value="">全部</option>${SNAP.instances.map((i) => `<option ${window._evFilter === i.instanceId ? 'selected' : ''} value="${esc(i.instanceId)}">${esc(i.instanceId)}</option>`).join('')}</select></p>
      <table><tr><th>时间</th><th>实例</th><th>域/类型</th><th>级别</th><th>主体</th></tr>${items.filter((e) => !window._evFilter || e.instanceId === window._evFilter).map((e) => `<tr><td class=dim>${esc(String(e.ts).slice(11, 19))}</td><td>${esc(e.instanceId)}</td><td>${esc(e.domain)}/${esc(e.type)}</td><td class="${e.severity === 'critical' ? 'crit' : e.severity === 'warning' ? 'warn' : 'dim'}">${esc(e.severity)}</td><td>${esc(e.subject ?? '')}</td></tr>`).join('') || '<tr><td colspan=5 class=dim>无事件</td></tr>'}</table>`
  } else if (VIEW === 'collab') {
    const c = SNAP.collab || { peers: [], totals: {} }
    const t = c.totals || {}
    const roleLabel = (r) => r === 'avatar' ? 'avatar（主人数字分身）' : (r || '未设置')
    const rows = (c.peers || []).map((p) => `<tr>
      <td>${p.identityVerified ? esc(p.agentId) : '<span class="warn">未验证</span>'}
        <br><span class="dim">${esc(p.name || '')}${p.device ? ' @ ' + esc(p.device) : ''}</span></td>
      <td>${esc(p.owner || '—')}<br><span class="dim">${esc(roleLabel(p.role))}</span></td>
      <td>↓${p.inbound} / ↑${p.outbound}</td>
      <td class="dim">${esc(Object.keys(p.systems || {}).join(', '))}</td>
      <td class="dim">${esc(p.lastTs)}<br>${esc(p.lastSubject || '')}</td>
      <td>${p.identityVerified ? '<span class="ok">✅ Hub 回填</span>' : '<span class="warn">⚠️ 身份未验证</span>'}</td></tr>`).join('')
    const denied = (SNAP.events || []).filter((e) => String(e.type).startsWith('collab.gate-denied')).slice(-20).reverse()
      .map((e) => `<tr><td class="dim">${esc(e.ts)}</td><td>${esc(e.subject ?? '')}</td><td class="warn">${esc(e.decision)}</td><td class="dim">${esc(e.reason || '')}</td></tr>`).join('')
    const msgs = (SNAP.events || []).filter((e) => String(e.type).startsWith('collab.message')).slice(-25).reverse()
      .map((e) => `<tr><td class="dim">${esc(String(e.ts).slice(11, 19))}</td><td>${esc(e.instanceId)}</td><td>${e.direction === 'inbound' ? '↓ 入' : '↑ 出'}</td><td>${e.peerAgentId ? esc(e.peerAgentId) : '<span class="warn">未验证</span>'}<br><span class="dim">${esc(e.peerName || e.peerDevice || '')}</span></td><td class="${e.severity === 'critical' ? 'crit' : e.severity === 'warning' ? 'warn' : 'dim'}">${esc(e.severity)}</td><td>${esc(e.subject ?? '')}</td></tr>`).join('')
    v.innerHTML = `<h2>协作总览（御驿消息结构化）</h2>
      <p>对端 <b>${t.peers ?? 0}</b> · 身份已验证 <b class="ok">${t.verified ?? 0}</b> · 未验证 <b class="${(t.unverified ?? 0) > 0 ? 'warn' : 'dim'}">${t.unverified ?? 0}</b> · 入向 ${t.inbound ?? 0} / 出向 ${t.outbound ?? 0} · 闸门拒绝 <b class="${(t.gateDenied ?? 0) > 0 ? 'warn' : 'dim'}">${t.gateDenied ?? 0}</b></p>
      <p class="dim">身份字段由实例转写 Yuyi Hub 权威回填值（peerAgentId/peerOwner/peerRole）；平台不连 Hub、不查御符内部接口、不推测身份。peerAgentId 缺席即「未验证」（老 Hub 不回填），如实呈现。</p>
      <table><tr><th>对端（御符）</th><th>Owner / 角色</th><th>流量</th><th>系统</th><th>最近</th><th>身份来源</th></tr>${rows || '<tr><td colspan=6 class=dim>暂无协作消息事件（实例未上报或本期无跨 Agent 通信）</td></tr>'}</table>
      <h2>闸门拒绝证据（治理执行，最近 20）</h2>
      <table><tr><th>时间</th><th>主体</th><th>闸门结论</th><th>依据</th></tr>${denied || '<tr><td colspan=4 class=dim>无拒绝记录</td></tr>'}</table>
      <h2>消息事件（最近 25）</h2>
      <table><tr><th>时间</th><th>实例</th><th>向</th><th>对端</th><th>级别</th><th>主体</th></tr>${msgs || '<tr><td colspan=6 class=dim>无消息事件</td></tr>'}</table>`
  } else if (VIEW === 'knowledge') {
    const rq = SNAP.reviewQueue || { entries: 0, raw: '' }
    const lines = (rq.raw || '').split(/\r?\n/).filter((l) => l.trim().startsWith('- ') || /^\s+\w+:/.test(l))
    v.innerHTML = `<h2>评审队列（review-queue.yaml）</h2>
      <p>队列条目数：<b>${rq.entries}</b>${rq.entries === 0 ? ' <span class="ok">（空队列 = 无待审核项）</span>' : ' <span class="warn">（有待审核项，请到治理操作页升级）</span>'}</p>
      ${lines.length ? `<table><tr><th>队列明细</th></tr>${lines.map((l) => `<tr><td class=dim>${esc(l.trim())}</td></tr>`).join('')}</table>` : ''}
      <h2>知识域事件（最近 20）</h2>
      <table><tr><th>时间</th><th>类型</th><th>主体</th></tr>${(SNAP.events || []).filter((e) => e.domain === 'knowledge').slice(-20).reverse().map((e) => `<tr><td class=dim>${esc(e.ts)}</td><td>${esc(e.type)}</td><td>${esc(e.subject ?? '')}</td></tr>`).join('') || '<tr><td colspan=3 class=dim>无知识域事件</td></tr>'}</table>
      <h2>治理留痕（知识相关）</h2>
      <table><tr><th>时间</th><th>动作</th><th>主体</th></tr>${(SNAP.governance || []).filter((e) => String(e.type).includes('knowledge')).slice(-20).reverse().map((e) => `<tr><td class=dim>${esc(e.ts)}</td><td>${esc(e.type)}</td><td>${esc(e.subject ?? '')}</td></tr>`).join('') || '<tr><td colspan=3 class=dim>无知识治理留痕</td></tr>'}</table>
      <h2>说明</h2><p class="dim">升级操作走「治理操作」页（待审核 → 已确认）；操作修订条目 status 并发 governance 审计事件，不旁路 review-queue 纪律。</p>`
  } else if (VIEW === 'runtime') {
  const rt = SNAP.runtime ?? { available: false }
  v.innerHTML = !rt.available ? '<p class="warn">运行时数据不可用：' + esc(rt.reason) + '</p>' :
    '<h2>模型性能（omp agent.db 只读摄取）</h2><table><tr><th>模型</th><th>样本</th><th>输出 tokens</th><th>平均生成 ms</th><th>平均 TTFT ms</th></tr>' +
    rt.models.map((m) => '<tr><td>' + esc(m.model) + '</td><td>' + m.samples + '</td><td>' + m.outputTokens + '</td><td>' + m.avgGenMs + '</td><td>' + m.avgTtftMs + '</td></tr>').join('') + '</table>'
} else if (VIEW === 'govern') {
    const tasks = SNAP.tasks || {}
    const taskIds = Object.keys(tasks)
    const roots = SNAP.roots || []
    const opts = roots.map((r) => `<option value="${esc(r.instanceId)}" data-root="${esc(r.taskRoot)}">${esc(r.instanceId)} · ${esc(r.label || '')} [${esc(r.status)}]</option>`).join('')
    v.innerHTML = `<h2>跨实例统一治理 · 任务 confirm / reject</h2>
      <p class="dim">仅对「待确认」状态的任务有效；四不变量由 task-ledger 强制，平台不旁路。批量按逐个调用，各自留痕（部分失败逐条报告）。</p>
      <p><b>操作者</b>：<input id="g-by" placeholder="主人（confirm 只能由主人发起）" size="24"> <span class="dim">必填——平台不代填「主人」，以谁的名义落定就记谁</span></p>
      <p>实例：<select id="g-inst" onchange="pickRoot()"><option value="">— 选择实例（自动填 root）—</option>${opts}</select></p>
      <p>任务号：<input id="g-task" placeholder="OPSP-P0, OPSP-P1（逗号/空格分隔 = 批量）" size="34">
         root：<input id="g-root" value="${esc(roots[0] ? roots[0].taskRoot : '/workspace')}" size="34">
         <button class="btn" onclick="govern('confirm')">confirm</button>
         <button class="btn" onclick="govern('reject')">reject</button></p>
      <p class="dim">地址簿来源：${esc(SNAP.addressBookSource || '（未配置 data-roots.yml）')} · 任务（点击填入）：${
        taskIds.map((id) => `<a href="#" onclick="fillTask('${esc(id)}');return false" class="${tasks[id].state === '已落定' ? 'dim' : ''}">${esc(id)}<span class="dim">(${esc(tasks[id].state)})</span></a>`).join(' ') || '（暂无任务事件）'}</p>
      <h2>知识条目升级（待审核 → 已确认）</h2>
      <p>条目名：<input id="k-entry" placeholder="omp-extension-contract-pitfalls" size="36">
         <button class="btn" onclick="kPromote()">升级为已确认</button></p>
      <h2>治理结果</h2><pre id="g-out" class="dim">${esc(window._govResult || '')}</pre>`
  }
}
function pickRoot() {
  const r = (SNAP.roots || []).find((x) => x.instanceId === $('#g-inst').value)
  if (r) $('#g-root').value = r.taskRoot
}
function fillTask(id) {
  const el = $('#g-task'); const cur = el.value.trim()
  el.value = cur === '' ? id : (cur.split(/[,\s]+/).includes(id) ? cur : cur + ', ' + id)
}
async function govern(action) {
  const ids = $('#g-task').value.split(/[,\s]+/).map((s) => s.trim()).filter(Boolean)
  const root = $('#g-root').value.trim()
  const by = ($('#g-by').value || '').trim()
  if (ids.length === 0) { $('#g-out').textContent = '请先填任务号（可逗号分隔批量）'; return }
  if (by === '') { $('#g-out').textContent = '请先填「操作者」——平台不代填「主人」，confirm 只能由主人发起'; return }
  if (!confirm(`以「${by}」的名义，对 ${ids.length} 个任务执行 ${action.toUpperCase()}？\n${ids.join('\n')}\nroot = ${root}\n（逐个调用 ledger，各自留痕；部分失败逐条报告）`)) return
  let acc = ''
  for (const taskId of ids) {
    try {
      // confirmReal: 人工已在上方 confirm 对话框二次确认；脚本路径须自行显式携带（服务端据此拦自动化误写）
      const r = await fetch('/api/govern/task', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ taskId, root, action, by, confirmReal: true }) })
      const j = await r.json()
      const msg = String(j.out ?? j.error ?? JSON.stringify(j)).trim().split('\n').filter(Boolean).pop()
      acc += `${j.ok ? '✅' : '❌'} ${taskId}：${msg}\n`
    } catch (e) { acc += `❌ ${taskId}：${e.message}\n` }
    window._govResult = acc
    $('#g-out').textContent = acc
  }
  refresh()
}
async function kPromote() {
  const entry = $('#k-entry').value.trim(); if (!entry) return
  const by = ($('#g-by').value || '').trim()
  if (by === '') { window._govResult = '请先填「操作者」（平台不代填「主人」）'; $('#g-out').textContent = window._govResult; return }
  if (!confirm(`以「${by}」的名义将 ${entry} 升级为「已确认」？（将留治理审计）`)) return
  const r = await fetch('/api/govern/knowledge', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ entry, to: '已确认', by }) })
  const j = await r.json(); window._govResult = j.ok ? `✅ 已升级：${entry}` : `❌ ${j.error ?? '失败'}`; $('#g-out').textContent = window._govResult; refresh()
}
async function approv(requestId, decision) {
  const by = (prompt(`以谁的名义${decision === 'allow' ? '批准' : '拒绝'}？（操作者标识，必填——平台不代填「主人」）`) || '').trim()
  if (by === '') { alert('必须提供操作者标识（平台不代填「主人」）'); return }
  const reason = prompt(`${decision === 'allow' ? '批准' : '拒绝'}理由（可空）：`) || ''
  if (!confirm(`以「${by}」的名义对 ${requestId} 执行 ${decision.toUpperCase()}？（将留治理审计）`)) return
  const r = await fetch('/api/govern/approval', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ requestId, decision, by, reason }) })
  const j = await r.json(); window._govResult = j.ok ? `✅ 已${decision === 'allow' ? '批准' : '拒绝'}：${requestId}` : `❌ ${j.error ?? '失败'}`; $('#g-out').textContent = window._govResult; refresh()
}
document.querySelectorAll('nav button').forEach((b) => b.onclick = () => {
  document.querySelectorAll('nav button').forEach((x) => x.classList.remove('active')); b.classList.add('active')
  VIEW = b.dataset.v; render()
})
document.addEventListener('change', (e) => { if (e.target && e.target.id === 'ev-filter') { window._evFilter = e.target.value; render() } })
refresh(); setInterval(refresh, 10000)
</script>
